name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build tools
        run: dnf install -y clang cmake gcc-c++ git ninja-build python3
      - uses: actions/checkout@v4
      - name: Configure
        run: CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPEX_BUILD_MODULE_TESTS=OFF
      - name: Build app and game modules
        run: cmake --build build --target ApexPredator --parallel 2
      - name: Stage artifact
        run: |
          mkdir -p dist/modules
          cp build/ApexPredator dist/
          cp build/modules/generation_zero.so build/modules/rage2.so build/modules/second_extinction.so dist/modules/
          (cd dist && cmake -E tar xJf "$GITHUB_WORKSPACE/hashes.db.tar.xz" && cmake -E tar xJf "$GITHUB_WORKSPACE/rage2_hashes.db.tar.xz")
      - uses: actions/upload-artifact@v4
        with:
          name: ApexPredator-linux-x64
          path: dist/
          if-no-files-found: error

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DAPEX_BUILD_MODULE_TESTS=OFF
      - name: Build app and game modules
        run: cmake --build build --config Release --target ApexPredator --parallel 2
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/modules | Out-Null
          Copy-Item build/Release/ApexPredator.exe dist/
          Copy-Item -Path build/Release/modules/generation_zero.dll,build/Release/modules/rage2.dll,build/Release/modules/second_extinction.dll -Destination dist/modules/
          Push-Location dist
          cmake -E tar xJf "$env:GITHUB_WORKSPACE\hashes.db.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to unpack hashes.db' }
          cmake -E tar xJf "$env:GITHUB_WORKSPACE\rage2_hashes.db.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to unpack rage2_hashes.db' }
          cmake -E tar xJf "$env:GITHUB_WORKSPACE\second_extinction_hashes.db.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to unpack second_extinction_hashes.db' }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: ApexPredator-windows-x64
          path: dist/
          if-no-files-found: error

  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cpp_conversion'
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ApexPredator-linux-x64
          path: artifacts/ApexPredator-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: ApexPredator-windows-x64
          path: artifacts/ApexPredator-windows-x64
      - name: Package release assets
        run: |
          mkdir -p release
          chmod +x artifacts/ApexPredator-linux-x64/ApexPredator
          tar -czf release/ApexPredator-linux-x64.tar.gz -C artifacts/ApexPredator-linux-x64 .
          (cd artifacts/ApexPredator-windows-x64 && zip -qr "$GITHUB_WORKSPACE/release/ApexPredator-windows-x64.zip" .)
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Preview build #${{ github.run_number }}
          body: Automated build of ${{ github.sha }} from cpp_conversion.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release/ApexPredator-linux-x64.tar.gz
            release/ApexPredator-windows-x64.zip
